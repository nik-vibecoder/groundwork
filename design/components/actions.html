<h1 style="margin-top:14px">Actions</h1>
<p class="sub">Buttons, filter chips and tier tags.</p>
<h2>Buttons</h2>
<div class="btns" style="margin-top:0">
  <a class="btn" href="#">Get my numbers</a>
  <a class="btn btn--sec" href="#">Secondary</a>
</div>

<h2>Filter chips (click to toggle)</h2>
<div class="tags" role="group" aria-label="Demo filter">
  <button class="chip" aria-pressed="true">All</button>
  <button class="chip" aria-pressed="false">Squat</button>
  <button class="chip" aria-pressed="false">Hinge</button>
  <button class="chip" aria-pressed="false">Push</button>
</div>

<h2>Tags</h2>
<div class="row">
  <span class="tag tag--g">Tier 1</span>
  <span class="tag tag--a">Tier 2</span>
  <span class="tag tag--r">Tier 3</span>
</div>

<h2>Links</h2>
